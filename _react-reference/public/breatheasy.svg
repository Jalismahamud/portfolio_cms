<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#2d2d44"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00d4ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2d44"/>
      <stop offset="100%" stop-color="#232338"/>
    </linearGradient>
    <linearGradient id="figure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7fe8ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="600" cy="290" r="340" fill="url(#glow)"/>

  <!-- decorative floating dots -->
  <g fill="#00d4ff" opacity="0.5">
    <circle cx="140" cy="120" r="4"/>
    <circle cx="220" cy="480" r="3"/>
    <circle cx="1040" cy="150" r="4"/>
    <circle cx="1080" cy="500" r="3"/>
    <circle cx="90" cy="330" r="3"/>
    <circle cx="1120" cy="330" r="4"/>
  </g>
  <g fill="#ff6b6b" opacity="0.45">
    <circle cx="180" cy="230" r="3"/>
    <circle cx="1000" cy="420" r="3"/>
    <circle cx="960" cy="180" r="3"/>
  </g>

  <!-- breathing rings -->
  <g fill="none" stroke="#00d4ff" stroke-width="1.5">
    <circle cx="600" cy="300" r="150" opacity="0.15"/>
    <circle cx="600" cy="300" r="190" opacity="0.10"/>
    <circle cx="600" cy="300" r="230" opacity="0.06"/>
  </g>

  <!-- phone mockup -->
  <g transform="translate(450,90)">
    <rect x="0" y="0" width="300" height="480" rx="36" fill="url(#phone)" stroke="#3a3a55" stroke-width="3"/>
    <rect x="14" y="14" width="272" height="452" rx="24" fill="#161625"/>

    <!-- meditating figure -->
    <g transform="translate(150,235)">
      <!-- outer breathing halo -->
      <circle r="98" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.35"/>
      <circle r="78" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
      <!-- head -->
      <circle cx="0" cy="-58" r="18" fill="url(#figure)"/>
      <!-- body / lotus pose -->
      <path d="M -34 20
               C -34 -10, -14 -34, 0 -34
               C 14 -34, 34 -10, 34 20
               C 34 34, 20 30, 10 26
               C 6 40, -6 40, -10 26
               C -20 30, -34 34, -34 20 Z"
            fill="url(#figure)"/>
      <!-- arms resting on knees -->
      <path d="M -34 20 C -46 18, -56 10, -60 -2" stroke="url(#figure)" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M 34 20 C 46 18, 56 10, 60 -2" stroke="url(#figure)" stroke-width="8" fill="none" stroke-linecap="round"/>
    </g>

    <!-- app bar hint -->
    <rect x="30" y="46" width="90" height="10" rx="5" fill="#3a3a55"/>
    <circle cx="256" cy="51" r="10" fill="#3a3a55"/>

    <!-- bottom label -->
    <text x="150" y="428" text-anchor="middle" font-family="Georgia, 'DM Serif Text', serif" font-size="22" fill="#ffffff">Breathe. Balance. Be.</text>
  </g>

  <!-- wordmark -->
  <text x="600" y="600" text-anchor="middle" font-family="Georgia, 'DM Serif Text', serif" font-size="44" font-weight="700" fill="#ffffff">BreathEasy</text>
  <text x="600" y="632" text-anchor="middle" font-family="Verdana, sans-serif" font-size="18" letter-spacing="2" fill="#00d4ff">YOGA &amp; WELLNESS</text>
</svg>
